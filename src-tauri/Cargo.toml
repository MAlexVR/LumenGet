[package]
name = "lumen"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LumenGet: offline course classroom"

[lib]
name = "lumen"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
lumen-core.workspace = true
lumen-media.workspace = true
lumen-download.workspace = true
lumen-skool.workspace = true
lumen-hotmart.workspace = true
lumen-youtube.workspace = true
lumen-udemy.workspace = true
lumen-pluralsight.workspace = true
lumen-goldenlife.workspace = true
lumen-harbiz.workspace = true
lumen-mpris.workspace = true
thiserror.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
async-trait = "0.1"
url = "2"
minisign-verify = "0.2"
base64 = "0.22"
sha2 = "0.10"
tokio = { workspace = true, features = ["time", "process"] }

# Android has no trash folder: deletes there are permanent-only (see SystemTrash).
[target.'cfg(not(target_os = "android"))'.dependencies]
trash = "5"

[dev-dependencies]
lumen-download = { workspace = true, features = ["test-support"] }
async-trait = "0.1"
tempfile.workspace = true
serde_json.workspace = true
